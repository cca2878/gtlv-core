name: CI

on:
  push:
    branches: [dev, main] # dev 为快照验证，main 为合并后的正式验证
  pull_request:
    branches: [main] # dev -> main 的 PR 门禁

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: lint · test · wasm build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 遵循 rust-toolchain.toml（channel、components、targets 均已钉死），
      # 使 CI 与贡献者本地用同一套工具链。
      - name: Install pinned Rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test

      # 本 crate 须保持可为 wasm32-wasip1 构建：Go 壳正是这样消费它的，
      # 而 wasm 缺少一些只考虑原生时可能用到的 API。
      - name: build for wasm32-wasip1
        run: cargo build --release --target wasm32-wasip1
